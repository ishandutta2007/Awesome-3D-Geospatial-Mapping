<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="meshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .orbit-spin {
        transform-origin: 980px 180px;
        animation: spin 30s linear infinite;
      }
      .pulse-ring {
        transform-origin: 980px 180px;
        animation: pulse 4s ease-in-out infinite;
      }
      .float-badge-1 {
        animation: float1 6s ease-in-out infinite;
      }
      .float-badge-2 {
        animation: float2 7s ease-in-out infinite;
      }
      .float-badge-3 {
        animation: float3 8s ease-in-out infinite;
      }
      .radar-sweep {
        transform-origin: 980px 180px;
        animation: radar 8s linear infinite;
      }
      .particle-pulse {
        animation: blink 2.5s ease-in-out infinite alternate;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes radar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.1); opacity: 0.7; }
      }
      @keyframes float1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes blink {
        0% { opacity: 0.2; transform: scale(0.8); }
        100% { opacity: 0.9; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" stroke="#1e293b" stroke-width="1.5" fill="none"/>

  <!-- Background Digital Grid Matrix -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
  </g>

  <!-- Right Side Interactive 3D Geospatial Globe Graphic -->
  <g id="globe-system">
    <!-- Globe Atmosphere Glow -->
    <circle cx="980" cy="180" r="150" fill="url(#globeGlow)" />
    
    <!-- Outer Orbit Ring with Pulse -->
    <circle cx="980" cy="180" r="140" stroke="#38bdf8" stroke-dasharray="6,8" stroke-width="1.5" fill="none" class="pulse-ring" />
    <circle cx="980" cy="180" r="115" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

    <!-- 3D Latitude and Longitude Grids -->
    <ellipse cx="980" cy="180" rx="100" ry="100" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>
    <ellipse cx="980" cy="180" rx="75" ry="100" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    <ellipse cx="980" cy="180" rx="40" ry="100" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" fill="none"/>
    <ellipse cx="980" cy="180" rx="100" ry="40" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    <ellipse cx="980" cy="180" rx="100" ry="75" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" fill="none"/>
    
    <!-- Rotating Satellites & Orbits -->
    <g class="orbit-spin">
      <ellipse cx="980" cy="180" rx="130" ry="50" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4,6" fill="none" transform="rotate(-30 980 180)"/>
      <circle cx="850" cy="180" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
      <circle cx="1110" cy="180" r="3.5" fill="#c084fc" filter="url(#glow)"/>
    </g>

    <g class="radar-sweep" opacity="0.3">
      <line x1="980" y1="180" x2="1080" y2="80" stroke="#38bdf8" stroke-width="2" filter="url(#meshGlow)"/>
    </g>

    <!-- Point Cloud Cluster Nodes (Dynamic Spatial Data) -->
    <g class="particle-pulse">
      <circle cx="950" cy="150" r="3" fill="#38bdf8" filter="url(#meshGlow)"/>
      <circle cx="1010" cy="160" r="2.5" fill="#4ade80" filter="url(#meshGlow)"/>
      <circle cx="970" cy="210" r="3" fill="#f43f5e" filter="url(#meshGlow)"/>
      <circle cx="1020" cy="205" r="3.5" fill="#fbbf24" filter="url(#meshGlow)"/>
      <circle cx="940" cy="190" r="2" fill="#a855f7"/>
      <circle cx="995" cy="130" r="2" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Left Side Typography & Clear Foreground Content -->
  <g id="header-content" transform="translate(60, 0)">
    
    <!-- Top Pill / Tag -->
    <g transform="translate(0, 48)">
      <rect width="320" height="32" rx="16" fill="url(#badgeGrad)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="16" r="4" fill="#38bdf8" filter="url(#meshGlow)"/>
      <text x="28" y="21" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM GUIDE &#8226; 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome 3D Geospatial
    </text>
    <text x="0" y="180" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">
      &amp; Mapping Platforms
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Interactive 3D Globes &#8226; OGC 3D Tiles &#8226; LiDAR Point Clouds &#8226; Digital Twins &#8226; WebGIS Stack
    </text>

    <!-- Feature Pillars Badges (Floating softly without covering typography) -->
    <g transform="translate(0, 260)">
      
      <!-- Badge 1: 3D Tiles -->
      <g class="float-badge-1" transform="translate(0, 0)">
        <rect width="135" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🌐 3D Tiles / OGC</text>
      </g>

      <!-- Badge 2: Point Clouds & Photogrammetry -->
      <g class="float-badge-2" transform="translate(147, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">☁️ LiDAR Point Clouds</text>
      </g>

      <!-- Badge 3: Digital Twins -->
      <g class="float-badge-3" transform="translate(339, 0)">
        <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🏙️ Digital Twins &amp; GIS</text>
      </g>

      <!-- Badge 4: WebGL & WebGPU -->
      <g class="float-badge-1" transform="translate(516, 0)">
        <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">⚡ WebGL / WebGPU</text>
      </g>
    </g>

  </g>
</svg>
