<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primaryTextGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".3"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".2"/></linearGradient><radialGradient id="globeGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="70%" stop-color="#6366f1" stop-opacity=".08"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0"/></radialGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="meshGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes spin{0%{transform:rotate(0deg)}}@keyframes radar{0%{transform:rotate(0deg)}}@keyframes pulse{0%{transform:scale(1);opacity:.3}50%{transform:scale(1.1);opacity:.7}}@keyframes float1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes float2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes float3{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%{opacity:.2;transform:scale(.8)}}.orbit-spin,.pulse-ring{transform-origin:980px 180px;animation:spin 30s linear infinite}.pulse-ring{animation:pulse 4s ease-in-out infinite}.float-badge-1{animation:float1 6s ease-in-out infinite}.float-badge-2{animation:float2 7s ease-in-out infinite}.float-badge-3{animation:float3 8s ease-in-out infinite}.radar-sweep{transform-origin:980px 180px;animation:radar 8s linear infinite}.particle-pulse{animation:blink 2.5s ease-in-out infinite alternate}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="360" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16"/><g stroke="#38bdf8" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="100" x2="100" y1="0" y2="360"/><line x1="250" x2="250" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="550" x2="550" y1="0" y2="360"/><line x1="700" x2="700" y1="0" y2="360"/><line x1="850" x2="850" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/><line x1="1150" x2="1150" y1="0" y2="360"/></g><g id="globe-system"><circle cx="980" cy="180" r="150" fill="url(#globeGlow)"/><circle cx="980" cy="180" r="140" fill="none" stroke="#38bdf8" stroke-dasharray="6 8" stroke-width="1.5" class="pulse-ring"/><circle cx="980" cy="180" r="115" fill="none" stroke="#6366f1" stroke-opacity=".4" stroke-width="1.5"/><ellipse cx="980" cy="180" fill="none" stroke="#0ea5e9" stroke-opacity=".5" stroke-width="1.2" rx="100" ry="100"/><ellipse cx="980" cy="180" fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="75" ry="100"/><ellipse cx="980" cy="180" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1" rx="40" ry="100"/><ellipse cx="980" cy="180" fill="none" stroke="#818cf8" stroke-opacity=".4" stroke-width="1" rx="100" ry="40"/><ellipse cx="980" cy="180" fill="none" stroke="#818cf8" stroke-opacity=".3" stroke-width="1" rx="100" ry="75"/><g class="orbit-spin"><ellipse cx="980" cy="180" fill="none" stroke="#a855f7" 